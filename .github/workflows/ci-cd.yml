name: CI/CD Pipeline

on:
  push:
    branches:
      - dev

jobs:

  ci:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check index.html
        run: test -f index.html

      - name: Check dashboard.html
        run: test -f dashboard.html

      - name: Display files
        run: ls -la

      - name: CI completed
        run: echo "CI tests completed successfully"


  cd:
    name: CD - Deploy to Render
    needs: ci
    runs-on: ubuntu-latest

    steps:

      - name: Check Render secret
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK is not configured"
            exit 1
          else
            echo "Render deploy hook is configured"
          fi

      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -X POST "$RENDER_DEPLOY_HOOK"
