name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # CI - Continuous Integration
  # =========================
  ci:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:

      # Step 1: Get source code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Check index.html
      - name: Check index.html
        run: |
          if [ -f "index.html" ]; then
            echo "index.html found"
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

      # Step 3: Check dashboard.html
      - name: Check dashboard.html
        run: |
          if [ -f "dashboard.html" ]; then
            echo "dashboard.html found"
          else
            echo "ERROR: dashboard.html not found"
            exit 1
          fi

      # Step 4: Display project files
      - name: Display project files
        run: |
          echo "Project files:"
          ls -la

      # Step 5: CI completed
      - name: CI completed
        run: |
          echo "=============================="
          echo "CI completed successfully"
          echo "=============================="


  # =========================
  # CD - Continuous Deployment
  # =========================
  cd:
    name: CD - Deploy to Render
    needs: ci
    runs-on: ubuntu-latest

    steps:

      # Step 1: Check Render secret
      - name: Check Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: RENDER_DEPLOY_HOOK is not configured"
            exit 1
          else
            echo "Render Deploy Hook is configured"
          fi

      # Step 2: Deploy to Render
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Starting Render deployment..."

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "$RENDER_DEPLOY_HOOK")

          echo "Render response: $RESPONSE"

          if [ "$RESPONSE" -ge 200 ] && [ "$RESPONSE" -lt 300 ]; then
            echo "Render deployment triggered successfully"
          else
            echo "Render deployment failed"
            exit 1
          fi

      # Step 3: Deployment completed
      - name: CD completed
        run: |
          echo "=============================="
          echo "CD completed successfully"
          echo "Render deployment triggered"
          echo "=============================="
